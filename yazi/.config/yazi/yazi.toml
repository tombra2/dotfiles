[mgr]
show_hidden   = true
ratio         = [1, 3, 4]
sort_by       = "natural"
sort_sensitive = false
sort_reverse  = false
sort_dir_first = true
linemode      = "size"
show_symlink  = true

[preview]
tab_size      = 2
max_width     = 600
max_height    = 900
image_filter  = "triangle"
image_quality = 75

[opener]
edit = [
  { run = 'code "$@"', block = true, desc = "VS Code" },
]
open = [
  { run = 'xdg-open "$@"', desc = "open" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$0")"', desc = "Reveal in file manager" },
]

[open]
rules = [
  { mime = "text/*",             use = ["edit", "open"] },
  { mime = "application/json",   use = ["edit", "open"] },
  { mime = "image/*",            use = ["open"] },
  { mime = "video/*",            use = ["open"] },
  { mime = "audio/*",            use = ["open"] },
  { mime = "application/pdf",    use = ["open"] },
  { mime = "inode/x-empty",      use = ["edit"] },
  { mime = "*",                  use = ["open"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 5
bizarre_retry    = 5
image_alloc      = 536870912
suppress_preload = false

[log]
enabled = false
