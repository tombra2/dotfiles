# Tokyo Night Theme for Yazi

[flavor]
use = "tokyo-night"

[manager]
cwd = { fg = "#7aa2f7" }

# Hovered item
hovered         = { fg = "#c0caf5", bg = "#283457" }
preview_hovered = { underline = true }

# Find highlight
find_keyword  = { fg = "#ff9e64", bold = true, italic = true, underline = true }
find_position = { fg = "#f7768e", bg = "reset", bold = true, italic = true }

# Marker colors
marker_copied  = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut     = { fg = "#f7768e", bg = "#f7768e" }
marker_marked  = { fg = "#e0af68", bg = "#e0af68" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

# Tab bar
tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#565f89", bg = "#1f2335" }
tab_width    = 1

# Border
border_symbol = "│"
border_style  = { fg = "#3b4261" }

# Statusbar
syntect_theme = "base16-ocean.dark"

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#3b4261", bg = "#1a1b26" }

# Normal mode
mode_normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
mode_unset  = { fg = "#1a1b26", bg = "#f7768e", bold = true }

progress_label  = { fg = "#c0caf5", bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#1f2335" }
progress_error  = { fg = "#f7768e", bg = "#1f2335" }

permissions_t = { fg = "#565f89" }
permissions_r = { fg = "#e0af68" }
permissions_w = { fg = "#f7768e" }
permissions_x = { fg = "#9ece6a" }
permissions_s = { fg = "#bb9af7" }

[input]
border   = { fg = "#7aa2f7" }
title    = { fg = "#7aa2f7" }
value    = { fg = "#c0caf5" }
selected = { reversed = true }

[select]
border   = { fg = "#7aa2f7" }
active   = { fg = "#ff9e64", bold = true }
inactive = { fg = "#565f89" }

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#1f2335" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#565f89" }
desc            = { fg = "#bb9af7" }
separator       = "  "
separator_style = { fg = "#3b4261" }

[help]
on      = { fg = "#7aa2f7" }
exec    = { fg = "#9ece6a" }
desc    = { fg = "#565f89" }
hovered = { bg = "#283457", bold = true }
footer  = { fg = "#1a1b26", bg = "#7aa2f7" }

[filetype]
rules = [
  # Bilder
  { mime = "image/*", fg = "#7dcfff" },
  # Video
  { mime = "video/*", fg = "#bb9af7" },
  # Audio
  { mime = "audio/*", fg = "#e0af68" },
  # Archive / compressed
  { mime = "application/zip",             fg = "#f7768e" },
  { mime = "application/gzip",            fg = "#f7768e" },
  { mime = "application/x-tar",           fg = "#f7768e" },
  { mime = "application/x-bzip2",         fg = "#f7768e" },
  { mime = "application/x-7z-compressed", fg = "#f7768e" },
  { mime = "application/x-rar",           fg = "#f7768e" },
  # Code / Text
  { mime = "text/*",        fg = "#9ece6a" },
  { mime = "application/json", fg = "#e0af68" },
  # PDF / Docs
  { mime = "application/pdf", fg = "#ff9e64" },
  # Executables
  { name = "*.sh",  fg = "#9ece6a", bold = true },
  { name = "*.fish",fg = "#9ece6a", bold = true },
  # Dotfiles / configs
  { name = "*.toml", fg = "#e0af68" },
  { name = "*.yaml", fg = "#e0af68" },
  { name = "*.yml",  fg = "#e0af68" },
  { name = "*.env",  fg = "#f7768e" },
  # Fallback
  { name = "*", fg = "#c0caf5" },
]

