  { name = "*.toml",   text = "", fg = "#e0af68" },
  { name = "*.yaml",   text = "", fg = "#e0af68" },
  { name = "*.yml",    text = "", fg = "#e0af68" },
  { name = "*.md",     text = "", fg = "#7aa2f7" },
  { name = "*.txt",    text = "󰈙", fg = "#c0caf5" },
