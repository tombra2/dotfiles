onboarding = false

[theme]
name = "one-dark"

auto_switch = false
[terminal]
default_shell = "/usr/bin/bash"
shell_mode = "non_login"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
help = "prefix+?"
detach = "prefix+d"
reload_config = "prefix+q"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+x"
workspace_picker = "prefix+w"
goto = "prefix+g"
previous_workspace = ["alt+k", "alt+up"]
next_workspace = ["alt+j", "alt+down"]
new_tab = "prefix+n"
rename_tab = "prefix+r"
previous_tab = ["alt+h", "alt+left"]
next_tab = ["alt+l", "alt+right"]
switch_tab = ["prefix+1..9", "alt+1..9"]
close_tab = "prefix+k"
focus_pane_left = ["ctrl+h","ctrl+left"]
focus_pane_down = ["ctrl+j", "ctrl+down"]
focus_pane_up = ["ctrl+k","ctrl+up"]
focus_pane_right = ["ctrl+l", "ctrl+right"]
split_vertical = ["prefix+v"]
split_horizontal = ["prefix+h"]
close_pane = ["prefix+x"]
copy_mode = "prefix+["
zoom = "prefix+z"
resize_mode = "prefix+shift+z"

[[keys.command]]
key = "ctrl+f"
type = "popup"
command = 'exec "$HOME/.config/script/herdr-sessionizer"'
description = "Projekt-Fuzzy-Finder"
width = "80%"
height = "80%"

[ui]
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
prompt_new_tab_name = false
agent_panel_sort = "priority"
accent = "blue"

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false

[advanced]
scrollback_limit_bytes = 50000000
